[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resmed-sd-monitor"
version = "0.1.0"
description = "PAP therapy monitoring and clinical decision support from ResMed SD-card EDF data — segmented efficacy, breath-by-breath flow-wave analysis, pressure-flatness curves"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Felix Zhi" }]
keywords = [
    "cpap", "apap", "pap", "resmed", "airsense",
    "sleep-apnea", "edf", "sd-card", "ahi", "tecsa",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# numpy>=2.0: uses np.trapezoid
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "edfio>=0.4.5",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
resmed-sd-monitor = "resmed_sd_monitor.monitor:main"
resmed-sd-monitor-maskoff = "resmed_sd_monitor.maskoff:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
