name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev]
      - name: Unit tests
        run: pytest tests/test_monitor.py tests/test_i18n.py -q
      - name: End-to-end on synthetic data
        run: pytest tests/test_smoke.py -q

  demo-regeneration:
    # the committed sample report must match what the current code + generator
    # actually produce (regenerate + diff, no upload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[charts] pytest
      - name: Regenerate demo data and report
        run: |
          python examples/generate_demo_data.py /tmp/demo
          python -m resmed_sd_monitor --data-dir /tmp/demo --lang en --report
          ls /tmp/demo/reports/
