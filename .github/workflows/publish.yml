name: Publish to PyPI

# Trusted Publishing (OIDC): no API token is stored anywhere. Before the first
# run, register a pending publisher on PyPI (account sidebar -> Publishing) with
# repository CaufieldZ/resmed-sd-monitor, workflow publish.yml, environment pypi,
# project name resmed-sd-monitor, and create a `pypi` environment in the repo
# settings. After that, publishing a GitHub release uploads the matching version.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Check metadata and long description
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # mandatory for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
